name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: echo "sdk.dir=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - run: npm install --no-audit --no-fund
      - name: Bundle interviewer photos
        run: node scripts/fetch-portraits.mjs
        continue-on-error: true
      - run: npx cap add android
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "CH_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - name: Permissions, signing, version
        env:
          CH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-setup.js
      - name: Icons and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0e17' --splashBackgroundColor '#0a0e17'
        continue-on-error: true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        env:
          CH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$CH_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../CyberHire.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../CyberHire.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: CyberHire-android, path: CyberHire.apk }
      - name: Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" CyberHire.apk --title "CyberHire for Android (build ${{ github.run_number }})" --notes "Install CyberHire.apk on your phone. Runs on the phone with your own OpenAI key."
