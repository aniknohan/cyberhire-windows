<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0e17"><meta name="color-scheme" content="dark"><style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>CyberHire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: CyberHire's own dark console — sticky top nav, 1280px column; interview room is a full-bleed video call */
:root {
  color-scheme: dark;
  --bg: #0a0e17; --bg-2: #070a11; --card: #0d1424; --card-2: #111a2c; --line: #1c2638; --line-2: #26324a;
  --fg: #f1f5f9; --soft: #cbd5e1; --muted: #8b98ad; --dim: #5d6b82;
  --blue: #2563eb; --blue-hi: #3b82f6; --sky: #38bdf8; --cyan: #0ea5e9;
  --ok: #34d399; --amber: #f5c542; --bad: #f87171; --red: #ef4444;
  --heading: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.55 var(--body); min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (max-width: 640px) { .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* top nav */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(10,14,23,.86); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.05); }
.top .wrap { height: 58px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 15px var(--heading); letter-spacing: -.02em; background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(140deg, #1d4ed8, #0ea5e9); display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.nav button { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: 14.5px; white-space: nowrap; }
.nav button:hover { color: var(--fg); background: rgba(255,255,255,.03); }
.nav button[aria-current="page"] { background: rgba(255,255,255,.06); color: #fff; }
.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.badge-trial { font: 600 10.5px var(--mono); letter-spacing: .1em; color: var(--amber); border: 1px solid rgba(245,197,66,.45); background: rgba(245,197,66,.08); border-radius: 7px; padding: 4px 9px; white-space: nowrap; }
.who { display: inline-flex; align-items: center; gap: 8px; color: var(--soft); font-size: 14.5px; white-space: nowrap; }
.iconbtn { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 8px; cursor: pointer; display: inline-flex; }
.iconbtn:hover { color: #fff; background: rgba(255,255,255,.05); }

/* primitives */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 9px; padding: 9px 16px; font-weight: 500; font-size: 14px; cursor: pointer; border: 1px solid transparent; background: var(--blue); color: #fff; white-space: nowrap; }
.btn:hover { background: var(--blue-hi); }
.btn.sm { padding: 6px 12px; font-size: 13.5px; }
.btn.xl { padding: 13px 22px; font-size: 15.5px; border-radius: 10px; }
.btn.caps { text-transform: uppercase; letter-spacing: .01em; font-weight: 600; }
.btn.block { width: 100%; }
.btn.sec { background: var(--card-2); border-color: var(--line-2); color: var(--soft); }
.btn.sec:hover { background: #16213a; }
.btn.ghost { background: none; color: var(--soft); }
.btn.ghost:hover { background: rgba(255,255,255,.04); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.pad { padding: 22px; }
.eyebrow { font: 500 11.5px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); }
.label { font: 500 11.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--heading); margin: 0; text-wrap: balance; letter-spacing: -.025em; }
h1 { font-size: clamp(30px, 4.2vw, 38px); font-weight: 700; line-height: 1.12; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); } .soft { color: var(--soft); } .dim { color: var(--dim); }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.page { padding-block: 40px 72px; display: grid; gap: 24px; }
.ph { display: grid; gap: 10px; }
.ph p { max-width: 64ch; color: var(--muted); }
.grid { display: grid; gap: 22px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line-2); background: var(--card-2); border-radius: 7px; padding: 4px 9px; font: 500 12px var(--mono); color: var(--soft); white-space: nowrap; }
.empty-box { border: 1px dashed var(--line-2); border-radius: 12px; padding: 30px; display: grid; gap: 10px; }
.empty-box h3 { font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
.banner { border: 1px solid rgba(245,197,66,.35); background: rgba(245,197,66,.07); color: #fde68a; border-radius: 12px; padding: 12px 16px; font-size: 14px; }
.banner.err { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); color: #fecaca; }
.banner.info { border-color: rgba(56,189,248,.3); background: rgba(56,189,248,.06); color: #bae6fd; }

/* dashboard */
.dash-top { display: grid; grid-template-columns: minmax(0, 1.42fr) minmax(0, 1fr); gap: 24px; }
.hero { padding: 38px 32px 34px; background: radial-gradient(ellipse at 85% 25%, rgba(37,99,235,.28), transparent 55%), linear-gradient(135deg, #0d1424 30%, #0c1a33); display: grid; gap: 18px; align-content: start; }
.hero h1 { font-size: clamp(30px, 3.6vw, 38px); max-width: 15ch; }
.hero p { color: var(--soft); max-width: 46ch; font-size: 14.5px; }
.hero .name-row { display: flex; gap: 8px; flex-wrap: wrap; max-width: 420px; }
.hero .name-row input { flex: 1 1 180px; background: rgba(0,0,0,.25); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 12px; min-width: 0; }
.gauges { display: flex; justify-content: space-around; align-items: center; gap: 16px; flex-wrap: wrap; padding: 30px 20px; }
.gauge { display: grid; justify-items: center; gap: 16px; }
.ring { --p: 0; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c, var(--sky)) calc(var(--p) * 1%), #1a2436 0); }
.ring > div { width: 100px; height: 100px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font: 600 30px var(--heading); color: var(--soft); }
.stats6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 18px 16px 16px; display: grid; gap: 12px; border-radius: 14px; }
.tile .v { font: 600 26px/1 var(--heading); font-variant-numeric: tabular-nums; }
.dash-mid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 24px; align-content: start; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--soft); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
@media (max-width: 1100px) { .stats6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) { .dash-top, .dash-mid { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .stats6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chart svg { width: 100%; height: auto; display: block; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover .t { color: #fff; }
.row .t { font-weight: 500; color: var(--soft); min-width: 0; }
.row .m { font-size: 12.5px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.dec { font: 600 11px var(--mono); letter-spacing: .08em; padding: 3px 8px; border-radius: 6px; border: 1px solid; white-space: nowrap; }
.dec.sh { color: #6ee7b7; border-color: rgba(52,211,153,.45); background: rgba(52,211,153,.1); }
.dec.h { color: #34d399; border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.08); }
.dec.b { color: #fcd34d; border-color: rgba(251,191,36,.45); background: rgba(251,191,36,.1); }
.dec.n { color: #fca5a5; border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.1); }
.bars { display: grid; gap: 11px; }
.bar { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 40px; gap: 12px; align-items: center; font-size: 13.5px; color: var(--soft); }
.bar .track { height: 7px; border-radius: 99px; background: #1a2436; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--sky)); }
.bar .fill.g { background: linear-gradient(90deg, #059669, var(--ok)); }
.bar .val { font: 500 12px var(--mono); text-align: right; }

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 960px) { .setup { grid-template-columns: 1fr; } }
.selects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 20px; }
@media (max-width: 640px) { .selects { grid-template-columns: 1fr; } }
.field { display: grid; gap: 8px; min-width: 0; }
.field > label, .fl { font-size: 14px; font-weight: 500; color: var(--soft); }
.dd { position: relative; }
.dd > button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 12px; cursor: pointer; text-align: left; font-size: 14.5px; }
.dd > button[aria-expanded="true"], .dd > button:hover { border-color: #3b5a8f; }
.dd .menu { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; min-width: 100%; background: #0f1729; border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; max-height: 360px; overflow-y: auto; }
.dd .menu .grp { font: 500 10.5px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); padding: 8px 10px 4px; }
.dd .menu button { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer; text-align: left; font-size: 14.5px; white-space: nowrap; }
.dd .menu button:hover, .dd .menu button:focus-visible { background: rgba(255,255,255,.05); outline: none; }
.sec-title { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--soft); }
.sec-title .i { color: var(--cyan); }
.tiles { display: grid; gap: 8px; }
.t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .t2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 760px) { .t4, .t3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .t4, .t3, .t2 { grid-template-columns: 1fr; } }
.opt { text-align: left; background: #0c1220; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.opt:hover { border-color: var(--line-2); }
.opt[aria-pressed="true"] { border-color: var(--cyan); background: rgba(14,165,233,.09); }
.opt b { font-weight: 500; font-size: 14.5px; }
.opt span { font-size: 12px; color: var(--dim); }
.opt .rt { font: 11px var(--mono); color: var(--dim); margin-top: 3px; }
.opt.lg { padding: 12px 14px; }
.opt.lg span { color: var(--muted); }

/* scheduled + lobby */
.narrow { max-width: 820px; margin: 0 auto; width: 100%; }
.info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .info-grid { grid-template-columns: 1fr; } }
.info { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.info .hd { display: flex; gap: 8px; align-items: center; color: var(--soft); font-size: 14.5px; }
.info .hd .i { color: var(--cyan); }
.info .big { font: 600 18px var(--heading); letter-spacing: -.02em; }
.loop { display: flex; flex-wrap: wrap; gap: 14px 26px; }
.loop > div { display: flex; gap: 10px; align-items: center; min-width: 0; }
.av { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; border: 1px solid rgba(255,255,255,.1); }
.av svg { width: 100%; height: 100%; display: block; }
.lobby { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: start; max-width: 1180px; margin: 0 auto; width: 100%; }
@media (max-width: 900px) { .lobby { grid-template-columns: 1fr; } }
.preview { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 16px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #1a2540, #070a11 75%); border: 1px solid var(--line); display: grid; place-items: center; text-align: center; }
.preview .me { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font: 600 34px var(--heading); background: linear-gradient(150deg, #2b3b5e, #151e33); margin: 0 auto 12px; }
.pill { position: absolute; display: inline-flex; gap: 6px; align-items: center; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); border-radius: 7px; padding: 4px 9px; font-size: 12px; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.ctrl { display: inline-flex; gap: 7px; align-items: center; background: var(--card-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--soft); }
.ctrl[aria-pressed="false"] { color: var(--dim); }
.ctrl:disabled { cursor: default; opacity: .55; }
.kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.kv2 .label { font-size: 10.5px; }
.kv2 div > div:last-child { font-size: 14.5px; margin-top: 3px; }
.who-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--card-2); border-radius: 12px; padding: 12px 14px; }

/* room (full-bleed video call) */
.room { min-height: 100vh; background: #05070c; display: grid; grid-template-rows: auto 1fr auto; }
.rbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
.rbar .rec { display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px var(--mono); }
.rbar .rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.rbar .rchip { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; color: var(--soft); }
.rbar .stable { margin-left: auto; color: var(--ok); display: inline-flex; gap: 6px; align-items: center; }
.rmain { padding: 14px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; min-height: 0; }
.rmain.split { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); }
@media (max-width: 900px) { .rmain.split { grid-template-columns: 1fr; } }
.stage { position: relative; border-radius: 16px; overflow: hidden; background: #0b0f18; min-height: 340px; aspect-ratio: 16 / 9.6; max-height: calc(100vh - 300px); width: 100%; justify-self: center; }
.stage > svg.portrait { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .vign { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5)), linear-gradient(to top, rgba(0,0,0,.6), transparent 30%); }
.stage .ringfx { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; transition: box-shadow .2s; }
.stage.speaking .ringfx { box-shadow: inset 0 0 0 2px rgba(56,189,248,.65), inset 0 0 50px rgba(56,189,248,.18); }
.pip { position: absolute; top: 12px; right: 12px; width: clamp(130px, 16%, 230px); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: linear-gradient(150deg, #1b2740, #0b111d); border: 1px solid rgba(255,255,255,.14); display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--muted); }
.pip .me { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 600 15px var(--heading); background: #26365a; color: #fff; margin: 0 auto 4px; }
.pip .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.55); border-radius: 5px; padding: 1px 6px; font-size: 10.5px; color: #fff; }
.cap { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); width: min(92%, 780px); background: rgba(5,8,14,.82); border-radius: 10px; padding: 10px 18px; text-align: center; font-size: 16px; line-height: 1.5; }
.cap b { color: var(--sky); font-weight: 500; }
.plate { position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; background: rgba(5,8,14,.72); backdrop-filter: blur(8px); border-radius: 10px; padding: 8px 12px; }
.plate b { display: block; font-size: 14px; font-weight: 500; }
.plate span { display: block; font-size: 11.5px; color: var(--soft); }
.eq { display: flex; align-items: flex-end; gap: 3px; height: 15px; }
.eq i { width: 3px; height: 35%; border-radius: 2px; background: var(--sky); opacity: .4; }
.stage.speaking .eq i { opacity: 1; animation: eq .6s ease-in-out infinite alternate; }
.stage.speaking .eq i:nth-child(2) { animation-delay: .1s; } .stage.speaking .eq i:nth-child(3) { animation-delay: .22s; } .stage.speaking .eq i:nth-child(4) { animation-delay: .33s; }
@keyframes eq { from { height: 25%; } to { height: 100%; } }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,8,14,.72); backdrop-filter: blur(3px); padding: 20px; text-align: center; }
.overlay > div { display: grid; gap: 14px; justify-items: center; max-width: 440px; }
/* portrait motion */
.portrait .head { transform-origin: 80px 70px; transform-box: view-box; animation: idle 7s ease-in-out infinite; }
.stage.listening .portrait .head { animation: nod 3.4s ease-in-out infinite; }
.stage.speaking .portrait .head { animation: talkhead 2.6s ease-in-out infinite; }
.portrait .mouth-open { transform-origin: 80px 54.5px; transform-box: view-box; transform: scaleY(0); }
.stage.speaking .portrait .mouth-open { animation: talk .22s ease-in-out infinite alternate; }
.portrait .lids { transform-origin: 80px 44px; transform-box: view-box; transform: scaleY(0); animation: blinkeye 5.5s infinite; }
@keyframes idle { 0%,100% { transform: rotate(0) translateY(0); } 50% { transform: rotate(-.8deg) translateY(-.4px); } }
@keyframes nod { 0%,100% { transform: translateY(0); } 18% { transform: translateY(.9px) rotate(.4deg); } 36% { transform: translateY(0); } }
@keyframes talkhead { 0%,100% { transform: rotate(0); } 30% { transform: rotate(.9deg); } 70% { transform: rotate(-.6deg); } }
@keyframes talk { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
@keyframes blinkeye { 0%, 94%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
.side { display: grid; grid-template-rows: auto 1fr; min-height: 0; max-height: calc(100vh - 300px); border-radius: 16px; overflow: hidden; background: #070b12; border: 1px solid rgba(255,255,255,.08); }
.side .sh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.06); font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.side .sb { overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; font-size: 13.5px; }
.sev { font: 600 10px var(--mono); letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; border: 1px solid; }

  const convo = turns.map((t) => `${t.speaker === "interviewer" ? "YOU" : "CANDIDATE"}: ${t.text}`).join("\n") || "(the call just started — candidate has joined)";
  let stage;
  if (!turns.length) stage = "Open the round: greet the candidate by first name, introduce yourself and your role in one sentence, a touch of natural small talk, then ask your first question.";
  else if (asked >= target + 2) stage = "You are over time. Wrap up now: if you haven't, ask whether they have questions for you; otherwise close the round.";
  else if (asked >= target) stage = "You have covered enough main questions. Move toward wrap-up (questions for you, then goodbye) unless a critical follow-up is needed.";

  if (turns.length) rnd.adaptive = Math.max(-2, Math.min(2, (rnd.adaptive || 0) + sig));
  if (show) rnd.evidence_shown = true;

}

const TTS1_VOICES = new Set(["alloy", "ash", "coral", "echo", "fable", "onyx", "nova", "sage", "shimmer"]);
const Voice = {
  on: true, captions: true, speaking: false, supported: true, audio: null, _tok: 0,
  async tts(text, pid) {
    const p = PERSONA[pid] || {};

      const r = await fetch("https://api.openai.com/v1/audio/speech", { method: "POST", headers: { Authorization: "Bearer " + Keys.openai, "Content-Type": "application/json" }, body: JSON.stringify({ ...body, input: text.slice(0, 4000), response_format: "mp3" }) });

    };
    try { return await go({ model: "gpt-4o-mini-tts", voice: p.voice || "alloy", instructions: p.voice_style || "Speak naturally like a professional on a video call." }); }
    catch (e) { if (e.status === 401 || e.status === 429) throw e; return go({ model: "tts-1", voice: TTS1_VOICES.has(p.voice) ? p.voice : "alloy" }); }
  },
  async speak(text, pid, onEnd) {

    const done = () => { if (tok !== this._tok) return; this.speaking = false; setStage(); onEnd && onEnd(); };

/* Room */
function currentState(iv) { const idx = iv.current_round; const rnd = iv.rounds[idx]; const turns = iv.turns.filter((t) => t.round_index === idx); const lastI = [...turns].reverse().find((t) => t.speaker === "interviewer"); return { idx, rnd, turns, lastI }; }
function setStage() {

  st.classList.toggle("speaking", Voice.speaking); st.classList.toggle("listening", !Voice.speaking && !ROOM.busy);
  const iv = Store.ivs[route.id]; if (!iv) return; const p = PERSONA[currentState(iv).rnd.persona_id];
  const cs = currentState(iv); const s = $("#status"); if (s) s.textContent = cs.lastI && cs.lastI.round_complete ? "Round complete" : ROOM.busy ? `${first(p.name)} is taking notes…` : Voice.speaking ? `${first(p.name)} is speaking` : currentState(iv).lastI ? (ROOM.typing || !canVoice() ? "Your turn — type your answer below" : "Your turn — tap the mic to answer") : "";
}
async function interviewerSpeak(iv) {
  const { idx, rnd } = currentState(iv);
  ROOM.busy = true; ROOM.error = ""; roomParts(iv);
  try { if (rnd.status === "pending") { rnd.status = "active"; rnd.started_at = Date.now(); } const t = await nextTurn(iv, idx); ROOM.busy = false; roomParts(iv); Voice.speak(t.text, rnd.persona_id, () => afterSpeak(iv)); }
  catch (e) { console.warn(e); ROOM.busy = false; ROOM.error = aiErr(e); roomParts(iv); }
}
async function sendAnswer(iv) {
  const box = $("#answer"); const text = (box ? box.value : ROOM.draft).trim(); if (!text || ROOM.busy) return;
  Voice.stop();
  const { idx, rnd, lastI } = currentState(iv); const rid = uid();
  iv.responses.push({ id: rid, round_index: idx, round_type: rnd.type, interviewer_name: PERSONA[rnd.persona_id].name, question: lastI ? lastI.text : "", seed_question_id: lastI ? lastI.seed_question_id : null, transcript: text, duration: 0, wpm: null, fillers: fillerCounts(text), clarity: null, long_pauses: 0, words: text.split(/\s+/).filter(Boolean).length, evaluation: null, ts: Date.now() });
  iv.turns.push({ id: uid(), round_index: idx, speaker: "candidate", text, response_id: rid, ts: Date.now() });
  ROOM.draft = ""; ROOM.coach = iv.coach_mode ? { rid, state: "idle" } : null; Store.saveIv(iv);
  ROOM.busy = true; roomParts(iv);
  try { const t = await nextTurn(iv, idx); ROOM.busy = false; roomParts(iv); Voice.speak(t.text, rnd.persona_id); }
  catch (e) { iv.turns = iv.turns.filter((t) => t.response_id !== rid); iv.responses = iv.responses.filter((r) => r.id !== rid); ROOM.draft = text; ROOM.coach = null; ROOM.busy = false; ROOM.error = aiErr(e); Store.saveIv(iv); roomParts(iv); }
}
async function coachFeedback(iv) {
  const r = iv.responses.find((x) => x.id === ROOM.coach.rid); if (!r) return;
  ROOM.coach.state = "busy"; roomParts(iv);
  try { if (!r.evaluation) { const res = await evaluateResponses(ctxLine(iv), [{ id: r.id, question: r.question, transcript: r.transcript, metrics: metricsLine(r), seed: QBYID[r.seed_question_id] }]); applyEvals(iv, res.answers); Store.saveIv(iv); } ROOM.coach.state = r.evaluation ? "done" : "error"; }
  catch (e) { ROOM.coach.state = "error"; ROOM.coach.msg = aiErr(e); }

}
function undoLast(iv) {
  const { idx } = currentState(iv); const ts = iv.turns.filter((t) => t.round_index === idx); if (ts.length < 3) return;
  const last = ts[ts.length - 1], cand = ts[ts.length - 2]; if (last.speaker !== "interviewer" || cand.speaker !== "candidate") return;
  iv.turns = iv.turns.filter((t) => t.id !== last.id && t.id !== cand.id); iv.responses = iv.responses.filter((r) => r.id !== cand.response_id);
  ROOM.coach = null; ROOM.draft = cand.text; Store.saveIv(iv); Voice.stop(); roomParts(iv);
  const q = currentState(iv).lastI; if (q) Voice.speak(q.text, iv.rounds[idx].persona_id, () => afterSpeak(iv));
}
function completeRound(iv) {
  const { idx, rnd } = currentState(iv); Voice.stop(); if (Mic.recording) { ROOM.cancelRec = true; Mic.cancel(); } ROOM.listening = false; ROOM.transcribing = false;
  rnd.status = "completed"; rnd.completed_at = Date.now(); evaluateRound(iv, idx);

}

  const cats = [...new Set(D.questions.map((q) => q.category))].sort();
  app.innerHTML = `<div class="wrap page"><div class="ph"><div class="eyebrow">Question bank</div><h1>${D.questions.length} interview questions</h1><p>The interviewers draw from these, matched to your round, level and technical focus. ${NEWQ} come from your SOC Analyst, Cybersecurity Tools and Python PDFs, with repeated questions removed.</p></div>
    <div class="qbf"><input id="qb-q" type="search" placeholder="Search, e.g. Kerberos, tstats, phishing" value="${esc(QB.q)}"><select id="qb-round" aria-label="Round"><option value="">All rounds</option>${Object.entries(ROUND_LABEL).map(([k, v]) => `<option value="${k}" ${QB.round === k ? "selected" : ""}>${v}</option>`).join("")}</select><select id="qb-level" aria-label="Level"><option value="">All levels</option>${["L1", "L2", "L3", "All"].map((l) => `<option ${QB.level === l ? "selected" : ""}>${l}</option>`).join("")}</select><select id="qb-cat" aria-label="Category"><option value="">All categories</option>${cats.map((c) => `<option ${QB.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>

/* Interview room: after the interviewer finishes speaking, listen for the answer */
function afterSpeak(iv) {
  if (route.name !== "room" || route.id !== iv.id) return;
  const { lastI } = currentState(iv);
  if (!lastI || lastI.round_complete || ROOM.busy || ROOM.typing || ROOM.listening || ROOM.transcribing) return;
  startListening(iv);
}
async function startListening(iv) {
  if (!canVoice() || !Mic.micOn || ROOM.listening || ROOM.busy) { ROOM.typing = true; roomParts(iv); return; }
  Voice.stop(); ROOM.listening = true; ROOM.error = ""; roomParts(iv);
  Mic.onLevel = (l) => { const r = $("#pipRing"); if (r) r.style.boxShadow = `0 0 0 ${2 + l * 6}px rgba(52,211,153,${0.25 + l * 0.6})`; };
  let blob;
  try { blob = await Mic.record(); }
  catch (e) { ROOM.listening = false; ROOM.typing = true; ROOM.error = "Microphone unavailable — allow it in Android Settings → Apps → CyberHire → Permissions, or type your answer."; roomParts(iv); return; }
  ROOM.listening = false;
  if (route.name !== "room" || route.id !== iv.id || ROOM.cancelRec) { ROOM.cancelRec = false; roomParts(iv); return; }
  ROOM.transcribing = true; roomParts(iv);
  try {
    const stt = await transcribe(blob);
    ROOM.transcribing = false;
    if (!stt.text) {
      roomParts(iv); toast("Sorry, I didn't quite catch that. Please answer again.");
      if (!ROOM.retried) { ROOM.retried = true; startListening(iv); }
      return;
    }
    ROOM.retried = false;
    sendAnswer(iv, stt);
  } catch (e) { ROOM.transcribing = false; ROOM.error = aiErr(e); roomParts(iv); }
}
async function sendAnswer(iv, stt) {
  const typed = !stt; const box = $("#answer");
  const text = typed ? (box ? box.value : ROOM.draft).trim() : stt.text; if (!text || ROOM.busy) return;
  Voice.stop();
  const { idx, rnd, lastI } = currentState(iv); const rid = uid(); const words = text.split(/\s+/).filter(Boolean).length;
  const duration = typed ? 0 : stt.duration || 0;
  iv.responses.push({ id: rid, round_index: idx, round_type: rnd.type, interviewer_name: PERSONA[rnd.persona_id].name, question: lastI ? lastI.text : "", seed_question_id: lastI ? lastI.seed_question_id : null, transcript: text, duration, wpm: duration > 3 && words ? Math.round((words / (duration / 60)) * 10) / 10 : null, fillers: fillerCounts(text), clarity: typed ? null : stt.clarity, long_pauses: typed ? 0 : stt.long_pauses, words, evaluation: null, ts: Date.now() });
  iv.turns.push({ id: uid(), round_index: idx, speaker: "candidate", text, response_id: rid, ts: Date.now() });

  catch (e) { iv.turns = iv.turns.filter((t) => t.response_id !== rid); iv.responses = iv.responses.filter((r) => r.id !== rid); ROOM.draft = text; ROOM.typing = true; ROOM.coach = null; ROOM.busy = false; ROOM.error = aiErr(e); Store.saveIv(iv); roomParts(iv); }
}
function roomVoiceControls(iv) {

/* Practice with voice (and pronunciation scoring) */
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let prev = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
function pronunciationMatch(target, transcript) {
  const clean = (s) => s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  const t = clean(target).join(" "), words = clean(transcript); if (!words.length) return 0;
  const n = t.split(" ").length; let best = 0;
  for (const size of new Set([Math.max(1, n - 1), n, n + 1])) for (let i = 0; i <= Math.max(0, words.length - size); i++) { const w = words.slice(i, i + size).join(" "); best = Math.max(best, 1 - lev(t, w) / Math.max(t.length, w.length)); }
  return Math.round(best * 1000) / 10;
}
function vPractice(app) {
  const prompt = practicePrompt(); const r = PR.res; const voice = canVoice();

    <div class="practice"><div class="mods">${MODULES.map(([k, t]) => `<button type="button" data-mod="${k}" aria-current="${PR.mod === k}">${t}</button>`).join("")}</div>

        ${PR.mod !== "pronunciation" ? `<button class="btn ghost sm" id="pTypeT" type="button">${PR.typing || !voice ? "Hide typing" : "Type instead"}</button>` : ""}

      ${r.transcript ? `<p class="muted" style="font-size:13.5px">You said: “${esc(r.transcript)}”${r.wpm ? ` · ${Math.round(r.wpm)} wpm` : ""}</p>` : ""}
      <div class="sc3"><div><b class="num">${Math.round(r.communication_score)}</b><span>Communication</span></div><div><b class="num">${Math.round(r.technical_score)}</b><span>Technical</span></div><div><b class="num">${Math.round(r.technical_communication)}</b><span>Tech explanation</span></div></div>

    catch (e) { PR.busy = false; PR.err = aiErr(e); vPractice($("#app")); }
  });
}
